<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><title>回声收集箱 | 博医计划</title><link rel="stylesheet" href="../feedback.css?v=20261011-direct1"><link rel="stylesheet" href="admin.css?v=20261011-direct1"><script defer src="admin.js?v=20261011-direct1"></script></head>
<body><main class="admin-main"><a class="back" href="../../">山海有回声 · 博医计划</a><header class="feedback-heading"><span class="eyebrow">团队工作台</span><h1>回声收集箱</h1><p>收集感想，整理建议，留给下一次实践。</p></header>
<form id="login"><label class="field">访问凭证<input id="key" type="password" autocomplete="off" required minlength="32" placeholder="填写团队的访问凭证"></label><button class="submit" type="submit">打开收集箱</button><p class="privacy">凭证只在当前页面使用，关闭页面后需重新填写。留言内容不对外展示。</p></form>
<p id="status" role="status" aria-live="polite"></p>
<section id="workspace" hidden><div class="toolbar"><button id="export" type="button">导出筛选结果 CSV</button><button id="logout" type="button">退出</button></div><div class="summary" id="summary"></div>
<form id="filters"><label>栏目<select name="kind"><option value="">全部栏目</option><option value="reflections">实践感想</option><option value="practice">实践意向与建议</option><option value="feedback">快闪反馈</option></select></label><label>整理状态<select name="status"><option value="">全部状态</option><option value="new">待整理</option><option value="reviewed">已整理</option><option value="archived">已归档</option></select></label><label>起始日期<input name="from" type="date"></label><label>结束日期<input name="to" type="date"></label><label>评分<select name="rating"><option value="">全部评分</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select></label><label class="search">关键词<input name="q" maxlength="100" type="search" placeholder="搜索感想、建议或备注"></label><button type="submit">筛选</button></form>
<div id="items"></div><div class="pagination"><button id="prev" type="button">上一页</button><span id="page"></span><button id="next" type="button">下一页</button></div></section></main></body></html>
